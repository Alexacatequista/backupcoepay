    <rect x="62" y="125" width="10" height="10" rx="2"/>
    <rect x="82" y="125" width="10" height="10" rx="2"/>
    <rect x="215" y="125" width="10" height="10" rx="2"/>
    <rect x="245" y="125" width="10" height="10" rx="2"/>

