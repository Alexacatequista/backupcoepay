  <rect x="10" y="10" width="280" height="280" fill="none" stroke="#E2E8F0" stroke-width="2" rx="12"/>
  
  <!-- QR Finder Patterns -->
  <!-- Top Left -->
  <rect x="30" y="30" width="60" height="60" fill="#0A2540" rx="6"/>
  <rect x="40" y="40" width="40" height="40" fill="#FFFFFF" rx="4"/>
  <rect x="48" y="48" width="24" height="24" fill="#007DFE" rx="2"/>
  
  <!-- Top Right -->
  <rect x="210" y="30" width="60" height="60" fill="#0A2540" rx="6"/>
  <rect x="220" y="40" width="40" height="40" fill="#FFFFFF" rx="4"/>
  <rect x="228" y="48" width="24" height="24" fill="#007DFE" rx="2"/>
  
  <!-- Bottom Left -->
  <rect x="30" y="210" width="60" height="60" fill="#0A2540" rx="6"/>
  <rect x="40" y="220" width="40" height="40" fill="#FFFFFF" rx="4"/>
  <rect x="48" y="228" width="24" height="24" fill="#007DFE" rx="2"/>

