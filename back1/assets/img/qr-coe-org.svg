    <rect x="145" y="52" width="10" height="10" rx="2"/>
    <rect x="165" y="52" width="10" height="10" rx="2"/>

    <!-- Row 3 -->
    <rect x="105" y="72" width="10" height="10" rx="2"/>
    <rect x="125" y="72" width="10" height="10" rx="2"/>
    <rect x="135" y="72" width="10" height="10" rx="2"/>
    <rect x="175" y="72" width="10" height="10" rx="2"/>

    <!-- Mid bands -->
    <rect x="32" y="105" width="10" height="10" rx="2"/>
