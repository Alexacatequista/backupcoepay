  <rect x="116" y="116" width="68" height="68" rx="10" fill="#007DFE"/>
  <circle cx="150" cy="144" r="16" fill="#FFFFFF"/>
  <path d="M153 138 C148 136 144 139 144 144 C144 148 147 151 152 150 C154 149.6 155 148 155 146.5 L149 146.5 L149 143.5 L157 143.5 C157.2 147.5 154 153 149 153 C143 153 140 148 140 144 C140 140 144 135 150 135 C153 135 155 136 156.5 137.5 Z" fill="#007DFE"/>
  <text x="150" y="172" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">GCASH QR</text>
