    <rect x="145" y="215" width="10" height="10" rx="2"/>
    <rect x="175" y="215" width="10" height="10" rx="2"/>
    <rect x="205" y="215" width="10" height="10" rx="2"/>
    <rect x="245" y="215" width="10" height="10" rx="2"/>

