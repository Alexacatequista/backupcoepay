    <rect x="105" y="165" width="10" height="10" rx="2"/>
    <rect x="125" y="165" width="10" height="10" rx="2"/>
    <rect x="155" y="165" width="10" height="10" rx="2"/>
    <rect x="185" y="165" width="10" height="10" rx="2"/>
    <rect x="215" y="165" width="10" height="10" rx="2"/>
    <rect x="255" y="165" width="10" height="10" rx="2"/>

