  <path d="M100 45 L106 58 L120 52 L121 66 L135 66 L131 80 L144 86 L134 97 L144 107 L131 113 L135 127 L121 127 L120 141 L106 135 L100 148 L94 135 L80 141 L79 127 L65 127 L69 113 L56 107 L66 97 L56 86 L69 80 L65 66 L79 66 L80 52 L94 58 Z" fill="#1E3A8A" opacity="0.6"/>
  
