  <text x="100" y="172" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ICCT • COE</text>
  <text x="100" y="38" font-family="'Inter', Arial, sans-serif" font-size="8" font-weight="700" fill="#0A2540" text-anchor="middle" letter-spacing="1">COLLEGE OF ENGINEERING</text>
